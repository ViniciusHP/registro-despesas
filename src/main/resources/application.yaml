server:
  port: 8081
spring:
  application:
    name: budgeting

  http:
    client:
      connect-timeout: 10s
      read-timeout: 5m

  servlet:
    multipart:
      max-file-size: 50MB

  docker:
    compose:
      file: ./compose/compose.yaml

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  ai:
    model:
      chat: openai
      audio:
        transcription: openai
        speech: openai
    openai:
      base-url: http://localhost:11434/v1
      api-key: ollama

      chat:
        model: gemma4:e2b
        temperature: 0.8

      audio:
        speech:
          model: lfm3-audio-pt
          voice: female-portuguese
          response-format: wav
          speed: 1

        transcription:
          model: lfm3-audio:2b
          response-format: text
          temperature: 0
          prompt: >
            Áudio em português brasileiro. Áudio contém descrição de gastos financeiros.
            As frases geralmente contêm:
              - um valor em reais (número + "reais");
              - uma ação (gastei, paguei, comprei);
              - um local ou estabelecimento (mercado, farmática, restaurante, loja, etc.)

logging:
  level:
    org:
      springframework:
        ai: DEBUG